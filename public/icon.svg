<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Grid Subtle Overlay -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="120" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>
  
  <!-- Center Emblem: Layers & Sparkle -->
  <g filter="url(#glow)">
    <!-- Bottom Layer -->
    <path d="M140 280 L256 340 L372 280 L256 220 Z" fill="rgba(255,255,255,0.25)" />
    <!-- Middle Layer -->
    <path d="M140 240 L256 300 L372 240 L256 180 Z" fill="rgba(255,255,255,0.5)" />
    <!-- Top Layer -->
    <path d="M140 200 L256 260 L372 200 L256 140 Z" fill="url(#accentGrad)" />
  </g>
  
  <!-- Floating Sparkles -->
  <path d="M370 120 L378 140 L398 148 L378 156 L370 176 L362 156 L342 148 L362 140 Z" fill="#fbbf24" />
  <path d="M130 330 L135 344 L149 349 L135 354 L130 368 L125 354 L111 349 L125 344 Z" fill="#38bdf8" opacity="0.9" />
</svg>
